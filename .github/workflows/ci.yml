name: ci

# 0016 P4, revised by 0017-A. Two jobs, deliberately separate:
#
#   build       - provision the pinned dependencies, configure and compile the
#                 whole tree on a clean runner, then ship that build tree to
#                 `integration` as one artifact. Compile only: the suite has no
#                 reliable "needs a database" label (309 tests, only 17 carry
#                 `external`/`integration`, 59 carry no label at all), so
#                 splitting it by label would run database-backed tests without a
#                 database. The tests run in the job below instead.
#   integration - MySQL + Redis service containers, an isolated CI database with
#                 its own credentials, then the full CTest suite and both Python
#                 suites - against the tree `build` compiled, which is why this
#                 job no longer compiles anything itself.
#   image       - moved to .github/workflows/image.yml (0017-A) so it is charged
#                 only for changes that can affect the image, and always on main.
#
# No job needs an AI provider key, and TSan is deliberately not part of the
# required matrix (0016 section 11 decision 8).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:

  build:
    name: clean build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libmysqlclient-dev \
            python3 python3-pip python3-venv

      - name: Install Conan 2
        run: |
          python3 -m venv "$HOME/.conan-venv"
          "$HOME/.conan-venv/bin/pip" install --no-cache-dir "conan>=2,<3"
          echo "$HOME/.conan-venv/bin" >> "$GITHUB_PATH"

      - name: Bootstrap the pinned dependency graph
        run: tools/dev/bootstrap.sh

      - name: Configure and build
        run: |
          cmake --preset release
          cmake --build --preset release -j"$(nproc)"

      # 0017-A. One tar.gz rather than the directory: actions/upload-artifact
      # does not guarantee the executable bit, and the integration job has to
      # exec these test binaries. `-C build presets/release` keeps the archive
      # rooted at build/, so extracting it under build/ restores the exact path
      # the tests were configured with.
      #
      # 2026-10-11 (artifact audit): ship only what the suite needs at run time.
      # Object files, static libraries, dep/Makefile metadata, the CMake cache and
      # compile_commands.json are build-time only, are the bulk of the archive and
      # bake the runner's absolute paths into files nobody reads. Everything ctest
      # needs stays: the test binaries, `CTestTestfile.cmake` and the discovered
      # `*_tests.cmake` files (ctest re-runs its GoogleTest discovery at test
      # time).
      - name: Package the release build tree
        run: |
          tar -czf release-build.tar.gz -C build \
            --exclude='*.o' \
            --exclude='*.a' \
            --exclude='*.d' \
            --exclude='*.make' \
            --exclude='compiler_depend*' \
            --exclude='*.marks' \
            --exclude='CMakeCache.txt' \
            --exclude='compile_commands.json' \
            presets/release

      - name: Upload the release build tree
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: release-build.tar.gz
          # The payload is already compressed; recompressing only burns runner
          # time.
          compression-level: 0
          retention-days: 1

  integration:
    name: full test suite (MySQL + Redis)
    runs-on: ubuntu-24.04
    needs: build

    services:
      mysql:
        image: mysql:8.0
        env:
          # Ephemeral, job-scoped credentials: this container and the runner are
          # destroyed with the run, the values reach no artifact (the artifact
          # audit scanned every member for them) and they grant nothing outside
          # the job. They stay literals here on purpose - a service definition is
          # evaluated before any step, and an optional-secret expression in this
          # block left the container unhealthy on the runner (run 38132106588 sat
          # in "Initialize containers" for minutes). The step-level hygiene in
          # this job does not depend on them: the three root commands read the
          # password from MYSQL_PWD instead of the command line.
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: jobpilot_ci
          MYSQL_USER: jobpilot_ci
          MYSQL_PASSWORD: jobpilot_ci_password
        ports:
          - 3306:3306
        # Exactly the command that has been green on the runner since 0016. A
        # `#` line inside this folded scalar would be literal text (docker would
        # read it as the image name and fail with "invalid reference format"),
        # so the comment lives above the key.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ujobpilot_ci -pjobpilot_ci_password --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The tests read these names; the values point at the service containers
      # above and at a database nothing else uses.
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: jobpilot_ci
      MYSQL_USER: jobpilot_ci
      MYSQL_PASSWORD: jobpilot_ci_password
      # Used by the three root steps below through the `env` context, so the
      # password never appears in a command line (argv is visible in the process
      # table and in docker's own error output).
      MYSQL_ROOT_PASSWORD: ci-root-password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      # The review backfill test only runs when this names the same scratch
      # database, and it refuses to run against a database called `jobpilot`.
      JOBPILOT_TEST_REVIEW_DB: jobpilot_ci

    steps:
      - uses: actions/checkout@v5

      # 0017-A. No compiler and no Conan: this job executes binaries the `build`
      # job already produced. cmake stays because it is what ships `ctest`; the
      # MySQL client library and client are runtime needs of the tests and of the
      # schema load below.
      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libmysqlclient-dev default-mysql-client python3

      # 0017-A. The tar round trip restores the tree with the permissions it was
      # built with. The test binaries link their Conan dependencies statically,
      # so this job needs neither a Conan cache nor a virtualenv.
      - name: Download the release build tree
        uses: actions/download-artifact@v4
        with:
          name: release-build

      - name: Extract the release build tree
        run: |
          mkdir -p build
          tar -xzf release-build.tar.gz -C build

      - name: Load the schema into the CI database
        env:
          MYSQL_PWD: ${{ env.MYSQL_ROOT_PASSWORD }}
        run: |
          for file in database/schema/*.sql; do
            mysql --host=127.0.0.1 --user=root --database=jobpilot_ci < "$file"
          done

      # The schema test creates and drops its own databases, so the dedicated
      # user needs more than the single-database grant the service container
      # gives it. Root is used only here, inside the ephemeral job.
      - name: Grant the dedicated CI user what the schema test needs
        env:
          MYSQL_PWD: ${{ env.MYSQL_ROOT_PASSWORD }}
        run: |
          mysql --host=127.0.0.1 --user=root -e "
            GRANT ALL PRIVILEGES ON *.* TO 'jobpilot_ci'@'%';"

      # Printed so a failure documents its own environment: the server version,
      # the collation the schema asserts, how many tables the load produced, and
      # which accounts exist.
      - name: Record the database the tests will use
        env:
          MYSQL_PWD: ${{ env.MYSQL_ROOT_PASSWORD }}
        run: |
          mysql --host=127.0.0.1 --user=root -e "
            SELECT VERSION() AS server_version, @@collation_server AS collation_server;
            SELECT COUNT(*) AS tables_in_ci
              FROM information_schema.tables
              WHERE table_schema = 'jobpilot_ci' AND table_type = 'BASE TABLE';
            SELECT CONCAT(user, '@', host) AS account FROM mysql.user
              WHERE user IN ('root', 'jobpilot_ci');"

      - name: Full test suite
        run: ctest --test-dir build/presets/release --output-on-failure

      # 0017-B. The test-overlap audit concluded that no case is removable, but
      # its mapping is only a guard if something checks it: this fails the job
      # when a removed name is still live, a survivor is gone, the counts drift
      # from the live ctest list, or the report's marker disagrees with the map.
      - name: Coverage map guard
        run: |
          python3 tools/checks/test_coverage_map.py \
            --test-dir build/presets/release \
            --map docs/quality/test-merge-map.json

      - name: Python suites
        run: |
          (cd source_adapters && python3 -m unittest discover -s jobpilot_sources/tests -t .)
          (cd ai_worker && python3 -m unittest discover -s jobpilot_ai/tests -t .)
