server:
  host: 0.0.0.0
  port: 8080

mysql:
  # 127.0.0.1 avoids libmysqlclient's unix-socket default when MySQL
  # runs in a container on the same host; override with MYSQL_HOST.
  host: 127.0.0.1
  port: 3306
  database: jobpilot
  user: jobpilot
  max_conn: 10

redis:
  host: localhost
  port: 6379
  max_conn: 4
  timeout_ms: 1000

log:
  level: info

storage:
  root: storage
  max_file_bytes: 10485760

# 0013 AI matching. `enhancement_enabled: false` means a match completes
# deterministically in C++ the moment it is created (rule_result becomes the
# final result) with no worker required; when true the task stays pending for
# the optional Python worker, which may only add fields. `lease_seconds` is the
# worker lease, clamped to [1, 3600] at claim time; `max_attempts` caps
# stale-lease reclaims before a task is failed.
ai:
  enhancement_enabled: false
  lease_seconds: 120
  max_attempts: 3

# 0015A pre-ingest quality. The platform-name registry
# source_adapters/jobpilot_sources/data/platform_names.yaml is the SINGLE
# source of truth shared by the Python capture package and the C++ service.
# The service resolves its path at startup from JOB_QUALITY_PLATFORM_NAMES_FILE
# and falls back to that repo-relative default, so the service must be started
# from the repository root (as the documented run command does). A missing or
# unreadable file yields an empty registry plus a warning on stderr: unknown
# employer names never trigger a review (fail-open).
#
# Public visibility: only review_status = 0 (clean) jobs are returned by the
# public list/recommended endpoints. Setting
# JOB_PUBLIC_INCLUDE_NEEDS_REVIEW=true disables that predicate (compatibility
# rollback; no stored data is changed).
