# JobPilotAI source adapters configuration (manual, no auto-discovery).
#
# Copy to config.yaml and edit. Secrets never live here: the file only names
# the environment variable that holds the internal API token.

jobpilot:
  base_url: http://127.0.0.1:8080
  internal_token_env: INTERNAL_API_TOKEN

sources:
  - type: greenhouse
    board: example-company
    company: Example Company
    enabled: true

  - type: lever
    board: example-company
    company: Example Company
    enabled: true

  - type: ashby
    board: example-company
    company: Example Company
    enabled: true

  # China campus source (ExecPlan 0018). board is "<keyword>" or
  # "<keyword>|<city>". Multiple nowcoder boards are allowed in this list;
  # they are fetched sequentially with a 5 s minimum interval. Every result is
  # complete=false because one query returns at most 20 rows and has no
  # pagination - it is a bounded window, not a full scan. Disabled by default.
  - type: nowcoder
    board: "后端"
    enabled: false

  # - type: nowcoder
  #   board: "C++|深圳"
  #   enabled: false
