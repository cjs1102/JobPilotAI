# JobPilotAI source adapters configuration (manual, no auto-discovery).
#
# Copy to config.yaml and edit. Secrets never live here: the file only names
# the environment variable that holds the internal API token.

jobpilot:
  base_url: http://127.0.0.1:8080
  internal_token_env: INTERNAL_API_TOKEN

sources:
  - type: greenhouse
    board: example-company
    company: Example Company
    enabled: true

  - type: lever
    board: example-company
    company: Example Company
    enabled: true

  - type: ashby
    board: example-company
    company: Example Company
    enabled: true
