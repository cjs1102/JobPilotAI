# 0015A platform-name registry — SINGLE source of truth.
#
# Read by BOTH the Python capture/adapters package
# (jobpilot_sources/capture/... via jobpilot_sources.registry) and the C++ service
# (service/src/job/job_quality.cpp). There must never be a second hard-coded
# platform list in either language (test-asserted).
#
# Owner: the project maintainer. Entries are compared after normalisation
# (trim + lower-case + strip the suffixes 网 / 官网 / 招聘 / 招聘网 / 人才网),
# so `牛客` also matches `牛客网`. The registry is deliberately small and
# curated: an unknown name must NEVER trigger a review (fail-open).
version: 1
platform_names:
  - 牛客
  - 实习僧
  - 国聘
  - 智联招聘
  - 前程无忧
  - 中华英才网
  - 应届生求职网
  - 大街网
  - 猎聘
  - 拉勾
  - 看准
  - 职友集
  - nowcoder
  - boss直聘
  - 51job
  - lagou
  - liepin
  - zhaopin

# Deterministic hostname mapping (0015A option B, plan section 6.1 code 2).
# The `employer_is_platform` verdict is asserted ONLY when the normalized
# company matches a registered platform name AND the source_url host is that
# same platform's own domain (exact or subdomain match). A registered platform
# without a mapping here is never asserted: the finding degrades to the
# advisory `platform_host_unverified` and the row stays visible (fail-open).
# Maintainer-curated; the single source of truth for both languages.
platform_hosts:
  牛客: nowcoder.com, niuke.com
  实习僧: shixiseng.com
  国聘: iguopin.com
  智联招聘: zhaopin.com
  前程无忧: 51job.com
  中华英才网: chinahr.com
  应届生求职网: yingjiesheng.com
  大街网: dajie.com
  猎聘: liepin.com
  拉勾: lagou.com
  看准: kanzhun.com
  职友集: jobui.com
  nowcoder: nowcoder.com
  boss直聘: zhipin.com
  51job: 51job.com
  lagou: lagou.com
  liepin: liepin.com
  zhaopin: zhaopin.com
